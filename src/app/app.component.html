<div class="grid-container background">
  <div class="Cam block-bg">
    <webcam  [trigger]="triggerObservable" (imageCapture)="handleImage($event)" *ngIf="showWebcam"
    [videoOptions]="videoOptions"
    [imageQuality]="1"
    [width]="1600"
    [height]="1200"
    (cameraSwitched)="cameraWasSwitched($event)"
    (initError)="handleInitError($event)"
></webcam>
  </div>
  <div class="Controls block-bg">
      <button class="btn btn-success btn-block" (click)="triggerSnapshot();">Take A Snapshot</button>
    <button class="btn btn-danger btn-block" (click)="toggleWebcam();">Toggle Webcam</button>  
    <button type="button" class="btn btn-warning btn-block">info</button>
    <br/>
    <div *ngIf="webcamImage">
      <h2>Nice!</h2>
      <img [src]="webcamImage.imageAsDataUrl"/>
    </div>
  </div>
  <div class="Device block-bg">
    <div class="input-group mb-3">
      <div class="input-group-prepend">
        <span class="input-group-text" id="basic-addon1">#</span>
      </div>
      <input type="text" class="form-control"  id="deviceId" type="text" [(ngModel)]="deviceId" aria-describedby="basic-addon1">
    </div>
    <button (click)="showNextWebcam(deviceId);" class="btn btn-outline-success btn-block">Activate</button>
    <br/>
    
    <div class="text">
    <h4 *ngIf="errors.length > 0">Messages:</h4>
    <ul *ngFor="let error of errors">
      <li>{{error | json}}</li>
    </ul>
  </div>
  </div>
</div>
